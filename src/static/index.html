<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <button
        id="auth-button"
        class="auth-button"
        type="button"
        aria-label="Teacher sign in"
        aria-haspopup="dialog"
        title="Teacher sign in"
      >
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          width="24"
          height="24"
          fill="currentColor"
        >
          <path
            d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"
          />
        </svg>
      </button>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" hidden>
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <dialog id="auth-dialog" aria-labelledby="auth-dialog-title">
      <div class="auth-dialog-header">
        <h3 id="auth-dialog-title">Teacher sign in</h3>
        <button id="auth-close-button" class="auth-close-button" type="button">
          Close
        </button>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label for="teacher-username">Username:</label>
          <input
            type="text"
            id="teacher-username"
            name="username"
            autocomplete="username"
            required
          />
        </div>
        <div class="form-group">
          <label for="teacher-password">Password:</label>
          <input
            type="password"
            id="teacher-password"
            name="password"
            autocomplete="current-password"
            required
          />
        </div>
        <button type="submit">Sign in</button>
      </form>
      <div id="logout-panel" class="hidden">
        <p>You are signed in as a teacher.</p>
        <button id="logout-button" type="button">Sign out</button>
      </div>
      <div id="auth-message" class="hidden" role="status"></div>
    </dialog>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
